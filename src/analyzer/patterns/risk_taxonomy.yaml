- id: cn-specific-certification
  name: Requisito de certificación, trazabilidad o garantía del bien
  description: Identifica requisitos de certificación, registro, trazabilidad o garantía del bien que pueden ser
    habituales en bienes regulados y solo deben escalar cuando no admiten equivalencias o no se relacionan claramente
    con el objeto contractual.
  competition_dimension: proporcionalidad_de_requisitos
  risk_type: requisito de certificación o trazabilidad sujeto a contexto
  document_sections:
