  human_validation_required: true
  review_status: curated_initial_framework
  confidence_level: medium
  severity_rationale: 'Revisión sugerida: la señal podría requerir validación de proporcionalidad, equivalencias
    o justificación técnica.'
  evidence_type:
  - señal textual observable
  - fragmento documental
  - contexto cercano de cláusula
  - mitigantes o equivalencias cercanas si existen
  limitations:
  - La señal se basa en texto disponible y puede requerir revisión de anexos, aclaraciones o expediente completo.
  - La presencia de una señal no implica invalidez del requisito ni determina responsabilidad.
  - La prioridad orienta revisión humana y no constituye calificación jurídica automática.
  disclaimer: Mecanismo de apoyo analítico preventivo. No determina corrupción, ilegalidad, direccionamiento ni
    responsabilidad administrativa.
  interpretive_indicators:
