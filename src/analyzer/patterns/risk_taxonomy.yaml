  - representante autorizado
  - distribuidor exclusivo
  - empresa representante
  - proveedor oficial del fabricante
  - certificado de distribuidor autorizado
  - garantía del fabricante
  - garantia del fabricante
  - garantía del distribuidor autorizado
  - garantia del distribuidor autorizado
  possible_competition_effect:
  - Podría reducir alternativas disponibles si la condición opera de forma exclusiva o sin equivalencias verificables.
  normative_basis:
  - libre concurrencia
  - igualdad y no discriminación
  - trato justo
  - neutralidad competitiva
  procurement_principle:
