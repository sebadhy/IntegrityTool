  - capital mínimo
  - índice financiero
  - liquidez
  - solvencia
  semantic_signals:
  - umbral financiero elevado
  - acumulación de requisitos económicos
  possible_indicators:
  - El requisito financiero no explica relación con presupuesto o complejidad.
  - El umbral se combina con experiencia específica.
  mitigating_factors:
  - proporcional
  - según presupuesto referencial
  - debidamente justificado
  - consorcios
  possible_legitimate_justifications:
  - Necesidad de asegurar capacidad financiera durante la ejecución.
  human_review_questions:
  - ¿El umbral financiero está justificado y es proporcional?
  - ¿Se permite cumplir mediante consorcio u otra figura admisible?
  recommended_language:
  - validación de proporcionalidad financiera sugerida
