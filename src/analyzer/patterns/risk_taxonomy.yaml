  - registro sanitario
  - BPM
  - buenas prácticas de manufactura
  - trazabilidad
  - certificación ISO
  semantic_signals:
  - certificación como requisito habilitante
  - estándar específico sin equivalentes
  possible_indicators:
  - La certificación se exige sin justificar relación con el objeto.
  - No se aceptan certificaciones, registros o estándares equivalentes.
  mitigating_factors:
