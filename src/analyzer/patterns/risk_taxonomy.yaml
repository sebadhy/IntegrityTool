- id: cn-financial-restrictive
  name: Requisito financiero potencialmente restrictivo
  description: Identifica umbrales financieros que podrían elevar barreras de entrada si no guardan proporción con
    el objeto contractual.
  competition_dimension: proporcionalidad_de_requisitos
  risk_type: barrera financiera potencial
  document_sections:
