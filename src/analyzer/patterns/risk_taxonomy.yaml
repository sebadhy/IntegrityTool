- id: cn-weak-equivalence-clause
  name: Ausencia o debilidad de cláusula de equivalencia
  description: Identifica condiciones que podrían operar de forma cerrada cuando no se observan cláusulas claras
    de equivalencia funcional.
  competition_dimension: neutralidad_competitiva
  risk_type: ausencia de mitigante competitivo
  document_sections:
  - especificaciones técnicas
  - requisitos mínimos
  textual_signals:
  - deberá ser exactamente
  - características exactas
  - medidas exactas
  - sin equivalente
  - sin equivalentes
  - solo se aceptará
  - sólo se aceptará
  - solo se aceptan
  - marca X
  - marca específica
  - no se aceptan equivalentes
  semantic_signals:
  - falta de alternativa funcional
  - requisito formulado como condición única
  possible_indicators:
  - La cláusula exige cumplimiento exacto sin fórmula de equivalencia.
  - La equivalencia aparece negada o no resulta verificable.
  mitigating_factors:
  - o equivalente
  - se aceptarán equivalentes
  - o superior
  - equivalente funcional
  possible_legitimate_justifications:
  - Requisito mínimo necesario para desempeño, seguridad o compatibilidad.
  human_review_questions:
  - ¿La equivalencia está permitida de forma clara y verificable?
  - ¿La exigencia exacta responde a una necesidad técnica documentada?
  recommended_language:
  - convendría validar si se aceptan alternativas equivalentes
  prohibited_language:
  - corrupción
  - fraude
  - direccionamiento
  - ilegalidad detectada
