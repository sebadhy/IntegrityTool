  - certificación equivalente
  - registro sanitario o equivalente
  - estándares equivalentes
  - debidamente justificado
  - según normativa aplicable
  - cumplimiento de normativa aplicable
  - calidad del bien
  - seguridad
  - trazabilidad
  possible_legitimate_justifications:
  - Seguridad, calidad, trazabilidad, garantía o cumplimiento normativo aplicable al bien.
