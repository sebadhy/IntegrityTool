metadata:
  name: Integrity Tool - Taxonomía metodológica de señales documentales
  version: '2026.05'
  status: curated_initial_framework
  last_updated: '2026-05-19'
  purpose: Apoyar revisión humana preventiva de pliegos mediante señales documentales observables, contexto, mitigantes
    y preguntas de validación.
  non_purpose:
  - No detecta corrupción.
  - No determina ilegalidad.
  - No automatiza decisiones ni sanciones.
  - No reemplaza revisión técnica, jurídica o institucional.
  methodological_principles:
  - determinístico primero, procesamiento asistido opcional después
  - señal documental observable separada de interpretación contextual
  - priorización prudente para revisión humana
  - trazabilidad de evidencia textual y páginas
  - mitigación de falsos positivos mediante equivalencias, justificaciones y corpus histórico
  normative_grounding:
    ecuador:
    - Constitución de la República del Ecuador, Art. 288
    - Ley Orgánica del Sistema Nacional de Contratación Pública (LOSNCP)
    - Reglamento General a la LOSNCP
    - Principios aplicables de concurrencia, igualdad, trato justo, transparencia, calidad y participación nacional
      según corresponda
    international:
    - OECD Recommendation of the Council on Public Procurement
    - OECD Guidelines for Fighting Bid Rigging in Public Procurement
    - MAPS Methodology for Assessing Procurement Systems
    - Open Contracting Global Principles
    - UNCITRAL Model Law on Public Procurement
  institutional_dimensions:
  - neutralidad_competitiva
  - proporcionalidad_de_requisitos
  - barreras_de_entrada
  - interoperabilidad_y_compatibilidad
  - relacion_con_objeto_contractual
  - trazabilidad_documental
  - transparencia_y_trazabilidad
  governance:
    human_validation_required: true
    review_cycle: revisión periódica por especialistas en contratación pública, competencia y análisis documental
    change_control: todo cambio en patrones debe conservar evidencia observable, mitigantes, preguntas humanas y
      lenguaje no acusatorio
    prohibited_use: uso como dictamen legal, sancionatorio o determinación automática de responsabilidad
patterns:
- id: cn-brand-model-provider-reference
  name: Requisito de autorización comercial o técnica
  description: Identifica requisitos de autorización, acreditación de origen o respaldo técnico/comercial del bien
    que podrían requerir validación solo si operan de forma exclusiva o sin equivalencias.
  competition_dimension: neutralidad_competitiva
  risk_type: requisito de autorización o acreditación sujeto a contexto
  document_sections:
  - especificaciones técnicas
  - requisitos técnicos
  - ficha técnica
  textual_signals:
  - proveedor específico
  - tecnología propietaria
  - marca específica
  - distribuidor autorizado
  - comercializador autorizado
  - concesionario
  - fabricante autorizado
  - representante autorizado
  - distribuidor exclusivo
  - empresa representante
  - proveedor oficial del fabricante
  - certificado de distribuidor autorizado
  - garantía del fabricante
  - garantia del fabricante
  - garantía del distribuidor autorizado
  - garantia del distribuidor autorizado
  semantic_signals:
  - referencia a una solución comercial particular
  - dependencia de fabricante o proveedor
  - denominación técnica que podría cerrar alternativas
  possible_indicators:
  - Se exige autorización o respaldo comercial/técnico sin aclarar equivalencia.
  - El requisito aparece como condición obligatoria y no solo como acreditación de calidad, garantía o trazabilidad.
  mitigating_factors:
  - o equivalente
  - equivalente funcional
  - referencial
  - marcas equivalentes
  - se aceptarán equivalentes
  - o superior
  - garantía técnica
  - trazabilidad
  - calidad del bien
  - soporte técnico
  - mantenimiento
  - cumplimiento de normativa aplicable
  possible_legitimate_justifications:
  - Garantía, trazabilidad, soporte técnico o control de calidad del bien.
  - Compatibilidad técnica con infraestructura existente.
  - Continuidad operativa o estandarización técnicamente justificada.
  human_review_questions:
  - ¿El requisito de autorización, acreditación o respaldo admite alternativas equivalentes?
  - ¿La exigencia se justifica por garantía, trazabilidad, soporte, regulación o calidad del bien?
  recommended_language:
  - revisión general si se trata de acreditación habitual del bien
  - validar proporcionalidad, equivalencias y necesidad técnica
  prohibited_language:
  - corrupción
  - fraude
  - direccionamiento
  - ilegalidad detectada
  severity_guidance: suggested
  confidence_guidance: medium
  related_patterns:
  - cn-weak-equivalence-clause
  - cn-technical-closed-requirement
  - cn-interoperability-lock-in
  taxonomy_version: '2026.05'
  technical_dimension: vendor_lock_in
  institutional_dimension: neutralidad competitiva
