- id: cn-specific-experience
  name: Experiencia previa potencialmente desproporcionada
  description: Identifica experiencia solicitada de forma muy específica, idéntica o acumulativa respecto del objeto
    contractual.
  competition_dimension: proporcionalidad_de_requisitos
  risk_type: requisito de calificación potencialmente limitante
  document_sections:
  - experiencia
  - requisitos mínimos
  - evaluación
  textual_signals:
  - experiencia específica
  - contratos idénticos
  - mismo objeto
  - experiencia exclusiva
  - experiencia en el mismo objeto
  semantic_signals:
  - requisito de experiencia exacta
  - umbral de experiencia acumulado con otros requisitos
  possible_indicators:
  - Se exige experiencia idéntica en lugar de experiencia similar.
  - La experiencia se combina con montos, plazos o tecnologías muy específicas.
  mitigating_factors:
  - experiencia similar
  - experiencia relacionada
  - equivalente
  - consorcios
  - asociaciones
  possible_legitimate_justifications:
  - Complejidad técnica del objeto contractual.
  - Necesidad de asegurar capacidad de ejecución verificable.
  human_review_questions:
  - ¿La experiencia solicitada es proporcional al objeto contractual?
  - ¿Se aceptan experiencias similares o capacidades equivalentes?
  recommended_language:
  - revisar proporcionalidad de la experiencia exigida
  prohibited_language:
  - corrupción
  - fraude
  - direccionamiento
  - ilegalidad detectada
