# Only local test services. These public credentials are not Azure secrets.
name: integrity-storage-test
services:
  postgres:
    image: postgres@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: integrity_test
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: integrity_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "integrity_test", "-d", "integrity_test"]
      interval: 5s
      timeout: 5s
      retries: 10
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    environment:
      AZURITE_ACCOUNTS: integritytest:bG9jYWwtdGVzdC1vbmx5LWtleQ==
    ports:
      - "127.0.0.1:11000:10000"
