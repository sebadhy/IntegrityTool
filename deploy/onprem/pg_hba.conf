# Local container administration requires control of the container engine.
# No database port is published. All TCP clients must use TLS and SCRAM.
local all all trust
hostnossl all all 0.0.0.0/0 reject
hostnossl all all ::/0 reject
hostssl all all 0.0.0.0/0 scram-sha-256
hostssl all all ::/0 scram-sha-256
