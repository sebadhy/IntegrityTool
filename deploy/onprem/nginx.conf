pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 101m;
    server_tokens off;
    server {
        listen 8443 ssl;
        ssl_certificate /run/secrets/web_cert;
        ssl_certificate_key /run/secrets/web_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        location / {
            proxy_pass http://api:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-MS-CLIENT-PRINCIPAL "";
            proxy_set_header X-MS-TOKEN-AAD-ID-TOKEN "";
            proxy_read_timeout 120s;
        }
    }
    server {
        listen 127.0.0.1:8081;
        location = /healthz { proxy_pass http://api:8000/readyz; }
        location / { return 404; }
    }
}
